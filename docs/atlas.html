<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0d10">
  <title>BT Anatomi Atlası</title>
  <meta name="description" content="Gerçek bir abdomen-pelvis BT'si üzerinde Türkçe etiketli, etkileşimli anatomi atlası. Kesitlerde gezin, yapıları keşfedin, kendinizi test edin.">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="index.html" title="Ana sayfa">
      <span class="logo">◐</span>
      <div>
        <div class="eyebrow" id="eyebrow">BT ANATOMİ</div>
        <h1 id="title">BT Anatomi Atlası</h1>
      </div>
    </a>
    <div class="top-actions">
      <select id="caseSel" class="select" aria-label="Vaka" hidden></select>
      <div class="seg" id="lang" title="Yapı adı dili">
        <button data-lang="tr" class="on">TR</button>
        <button data-lang="en">EN</button>
        <button data-lang="la">LA</button>
      </div>
      <button id="shareBtn" class="btn" title="Bağlantıyı kopyala" aria-label="Bağlantıyı kopyala">🔗<span class="lbl"> Bağlantıyı kopyala</span></button>
      <button id="quizBtn" class="btn accent">🎯<span class="lbl"> Kendini test et</span></button>
    </div>
  </header>

  <section class="toolbar">
    <div class="row">
      <span class="caption">SİSTEMLER · AÇ / KAPAT</span>
      <span class="spacer"></span>
      <button class="btn small" id="allOn">Tümü</button>
      <button class="btn small" id="allOff">Hiçbiri</button>
    </div>
    <div class="chips" id="systems"></div>
    <div class="row wrap">
      <div class="seg" id="planes">
        <button data-plane="axial" class="on">Aksiyel</button>
        <button data-plane="coronal">Koronal</button>
        <button data-plane="sagittal">Sagittal</button>
      </div>
      <div class="seg" id="tools">
        <button data-tool="scroll" class="on" title="Sürükleyerek kesit değiştir">↕ Kesit</button>
        <button data-tool="pan" title="Sürükleyerek görüntüyü taşı">✥ Taşı</button>
      </div>
      <div class="seg">
        <button id="zoomOut" aria-label="Uzaklaştır">−</button>
        <button id="zoomLabel" class="ghost" title="Sığdır">100%</button>
        <button id="zoomIn" aria-label="Yakınlaştır">+</button>
      </div>
      <select id="windowSel" class="select" aria-label="Pencere ayarı">
        <option value="400,40">Yumuşak doku (W400 L40)</option>
        <option value="180,90">Karaciğer (W180 L90)</option>
        <option value="600,150">Damar (W600 L150)</option>
        <option value="1800,400">Kemik (W1800 L400)</option>
        <option value="1500,-600">Akciğer (W1500 L-600)</option>
      </select>
    </div>
  </section>

  <main class="layout">
    <section class="viewer-wrap">
      <div class="viewer-head">
        <span id="planeInfo" class="mono">AKSİYEL</span>
        <span class="spacer"></span>
        <label class="toggle"><input type="checkbox" id="labelsOn" checked> Etiketler</label>
        <label class="toggle"><input type="checkbox" id="outlineOn" checked> Kontur</label>
        <label class="toggle opacity">Dolgu <input type="range" id="opacity" min="0" max="90" value="45"></label>
      </div>
      <div class="viewer" id="viewer">
        <canvas id="canvas"></canvas>
        <div class="orient top" id="oTop"></div>
        <div class="orient bottom" id="oBottom"></div>
        <div class="orient left" id="oLeft"></div>
        <div class="orient right" id="oRight"></div>
        <div class="tooltip" id="tooltip" hidden></div>
        <div class="loading" id="loading">
          <div class="spinner"></div>
          <div id="loadingText">Atlas yükleniyor…</div>
        </div>
      </div>
      <div class="slice-bar">
        <button class="btn icon" id="prev" aria-label="Önceki kesit">‹</button>
        <input type="range" id="slider" min="0" max="0" value="0" aria-label="Kesit">
        <button class="btn icon" id="next" aria-label="Sonraki kesit">›</button>
        <span class="mono" id="sliceInfo">– / –</span>
      </div>
      <div class="quiz" id="quiz" hidden>
        <div class="quiz-head">
          <span class="caption">KENDİNİ TEST ET · Vurgulanan yapı hangisi?</span>
          <span class="spacer"></span>
          <span class="mono" id="quizScore">0 / 0</span>
          <button class="btn small" id="quizExam" title="20 soru, sonunda skor ve tekrar listesi">Sınav (20)</button>
          <button class="btn small" id="quizExit">Çık</button>
        </div>
        <div class="quiz-options" id="quizOptions"></div>
        <div class="quiz-foot">
          <span id="quizFeedback"></span>
          <span class="spacer"></span>
          <button class="btn accent small" id="quizNext" hidden>Sonraki →</button>
        </div>
      </div>
    </section>

    <aside class="panel">
      <div class="card" id="infoCard">
        <div class="caption">SEÇİLİ YAPI</div>
        <div id="info" class="info empty">Görüntüde bir yapıya veya etikete dokunun.</div>
      </div>
      <div class="card list-card">
        <div class="row">
          <span class="caption">YAPILAR</span>
          <span class="spacer"></span>
          <label class="toggle"><input type="checkbox" id="onlySlice"> Sadece bu kesit</label>
        </div>
        <input type="search" id="search" class="search" placeholder="Ara: pankreas, aorta, L3…">
        <div id="list" class="list"></div>
      </div>
      <p class="credit" id="credit"></p>
    </aside>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
