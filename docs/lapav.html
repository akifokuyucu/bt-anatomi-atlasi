<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#08090c">
  <title>Laparoskopik Video Atlası</title>
  <meta name="description" content="Gerçek bir laparoskopi videosu düz akar; filtre düğmesine basınca organlar ve aletler videonun üzerinde renkli ve Türkçe etiketli görünür.">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="64x64" href="icons/favicon-64.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="lapa.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@500;600;700&display=swap">
  <link rel="stylesheet" href="premium.css">
  <link rel="stylesheet" href="shell.css">
  <script>try{var t=localStorage.getItem("btatlas.theme");if(t==="light"||t==="dark")document.documentElement.dataset.theme=t}catch(e){}</script>
  <script src="shell.js" defer></script>
  <script src="ui.js" defer></script>
</head>
<body>
  <div class="crumbbar"><nav class="crumbs" data-crumbs="Klinik Atlas=index.html|Atlaslar=index.html#laparoskopi|Laparoskopi video modu"></nav></div>
  <header class="topbar">
    <a class="brand" href="index.html" title="Ana sayfa">
      <span class="logo">◐</span>
      <div>
        <div class="eyebrow" id="eyebrow">LAPAROSKOPİ · VİDEO</div>
        <h1 id="title">Laparoskopik Video Atlası</h1>
      </div>
    </a>
    <div class="top-actions">
      <span class="tag draft" title="Prototip: maskeler yarı otomatik, uzman onayı bekliyor">PROTOTİP</span>
      <div class="seg" id="lang" title="Yapı adı dili">
        <button data-lang="tr" class="on">TR</button>
        <button data-lang="en">EN</button>
        <button data-lang="la">LA</button>
      </div>
      <button id="shareBtn" class="btn" title="Bağlantıyı kopyala" aria-label="Bağlantıyı kopyala"><span data-icon="link"></span><span class="lbl"> Bağlantıyı kopyala</span></button>
    </div>
  </header>

  <main class="layout">
    <section class="viewer-wrap">
      <div class="toolbar">
        <div class="chips" id="filters" role="group" aria-label="Filtreler"></div>
      </div>
      <div class="viewer lapav" id="viewer">
        <video id="video" muted playsinline preload="auto"></video>
        <canvas id="canvas"></canvas>
        <div class="tooltip" id="tooltip" hidden></div>
        <div class="loading" id="loading">
          <div class="spinner"></div>
          <div id="loadingText">Video yükleniyor…</div>
        </div>
      </div>
      <div class="slice-bar">
        <button class="btn icon" id="play" aria-label="Oynat"><span data-icon="play"></span></button>
        <button class="btn icon" id="prev" aria-label="Önceki kare">‹</button>
        <input type="range" id="seek" min="0" max="1000" value="0" step="1" aria-label="Zaman">
        <button class="btn icon" id="next" aria-label="Sonraki kare">›</button>
        <span class="mono" id="time">0:00 / 0:00</span>
        <div class="seg" id="speed" title="Oynatma hızı">
          <button data-r="0.5">½×</button>
          <button data-r="1" class="on">1×</button>
        </div>
      </div>
      <div class="viewer-head">
        <label class="toggle"><input type="checkbox" id="labelsOn" checked> Etiketler</label>
        <label class="toggle"><input type="checkbox" id="outlineOn" checked> Kontur</label>
        <label class="toggle opacity">Dolgu <input type="range" id="opacity" min="0" max="90" value="40"></label>
        <span class="spacer"></span>
        <span class="mono muted" id="frameMeta">–</span>
      </div>
    </section>

    <aside class="panel">
      <div class="card" id="infoCard">
        <div class="caption">SEÇİLİ YAPI</div>
        <div id="info" class="info empty">Bir filtreyi açın, sonra videoda bir yapıya dokunun.</div>
      </div>
      <div class="card list-card">
        <div class="row">
          <span class="caption">VİDEODAKİ YAPILAR</span>
          <span class="spacer"></span>
          <button class="btn small" id="allOn">Tümü</button>
          <button class="btn small" id="allOff">Hiçbiri</button>
        </div>
        <div id="list" class="list"></div>
      </div>
      <p class="credit" id="credit"></p>
    </aside>
  </main>

  <script type="module" src="lapav.js"></script>
</body>
</html>
