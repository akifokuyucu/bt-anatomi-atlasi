<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0d10">
  <title>Laparoskopik Anatomi Atlası</title>
  <meta name="description" content="Robotik cerrahi görüntülerinde Türkçe etiketli, etkileşimli anatomi atlası. Yapıları keşfedin, BT'deki karşılığını görün, kendinizi test edin.">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="lapa.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="index.html" title="Ana sayfa">
      <span class="logo">◐</span>
      <div>
        <div class="eyebrow" id="eyebrow">LAPAROSKOPİ</div>
        <h1 id="title">Laparoskopik Anatomi Atlası</h1>
      </div>
    </a>
    <div class="top-actions">
      <span class="tag draft" title="Prototip: içerik ve notlar uzman onayı bekliyor">PROTOTİP</span>
      <div class="seg" id="lang" title="Yapı adı dili">
        <button data-lang="tr" class="on">TR</button>
        <button data-lang="en">EN</button>
        <button data-lang="la">LA</button>
      </div>
      <button id="shareBtn" class="btn" title="Bağlantıyı kopyala" aria-label="Bağlantıyı kopyala">🔗<span class="lbl"> Bağlantıyı kopyala</span></button>
      <button id="quizBtn" class="btn accent">🎯<span class="lbl"> Kendini test et</span></button>
    </div>
  </header>

  <main class="layout">
    <section class="viewer-wrap">
      <div class="viewer-head">
        <span id="frameMeta" class="mono">–</span>
        <span class="spacer"></span>
        <label class="toggle"><input type="checkbox" id="labelsOn" checked> Etiketler</label>
        <label class="toggle"><input type="checkbox" id="outlineOn" checked> Kontur</label>
        <label class="toggle opacity">Dolgu <input type="range" id="opacity" min="0" max="90" value="35"></label>
      </div>
      <div class="viewer lapa" id="viewer">
        <canvas id="canvas"></canvas>
        <div class="tooltip" id="tooltip" hidden></div>
        <div class="loading" id="loading">
          <div class="spinner"></div>
          <div id="loadingText">Görüntüler yükleniyor…</div>
        </div>
      </div>
      <div class="slice-bar">
        <button class="btn icon" id="prev" aria-label="Önceki kare">‹</button>
        <input type="range" id="slider" min="0" max="0" value="0" aria-label="Kare">
        <button class="btn icon" id="next" aria-label="Sonraki kare">›</button>
        <span class="mono" id="frameInfo">– / –</span>
      </div>
      <div class="thumbs" id="thumbs"></div>
      <div class="quiz" id="quiz" hidden>
        <div class="quiz-head">
          <span class="caption">KENDİNİ TEST ET · Vurgulanan yapı hangisi?</span>
          <span class="spacer"></span>
          <span class="mono" id="quizScore">0 / 0</span>
          <button class="btn small" id="quizExit">Çık</button>
        </div>
        <div class="quiz-options" id="quizOptions"></div>
        <div class="quiz-foot">
          <span id="quizFeedback"></span>
          <span class="spacer"></span>
          <button class="btn accent small" id="quizNext" hidden>Sonraki →</button>
        </div>
      </div>
    </section>

    <aside class="panel">
      <div class="card" id="infoCard">
        <div class="caption">SEÇİLİ YAPI</div>
        <div id="info" class="info empty">Görüntüde bir yapıya veya listedeki bir ada dokunun.</div>
      </div>
      <div class="card list-card">
        <div class="row">
          <span class="caption">BU KAREDEKİ YAPILAR</span>
          <span class="spacer"></span>
          <button class="btn small" id="allOn">Tümü</button>
          <button class="btn small" id="allOff">Hiçbiri</button>
        </div>
        <div id="list" class="list"></div>
      </div>
      <p class="credit" id="credit"></p>
    </aside>
  </main>

  <script type="module" src="lapa.js"></script>
</body>
</html>
